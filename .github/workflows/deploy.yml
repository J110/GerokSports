name: Deploy to qrackpot-prod-1
on:
  push:
    branches: [derive-not-detect, main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline input source'
        required: true
        default: 'fixture'
        type: choice
        options:
          - fixture
          - live

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via IAP SSH
        run: |
          set +e
          gcloud compute ssh qrackpot-prod-1 \
            --zone=asia-south1-a \
            --tunnel-through-iap \
            --command="sudo -u anmolmohan_turingsdesign_com -H bash -c 'cd /mnt/data/sportscomm && git pull && bash deploy/deploy.sh'" \
            2>&1 | tee /tmp/deploy.log
          ssh_rc=${PIPESTATUS[0]}
          if grep -q "DONE in" /tmp/deploy.log; then
            echo "Remote deploy succeeded (DONE marker found; ssh rc=$ssh_rc — tolerated)"
            exit 0
          fi
          echo "Remote deploy failed (no DONE marker); ssh rc=$ssh_rc"
          exit 1

      - name: Sync pipeline.env on VM from GH secrets
        env:
          MODE: ${{ github.event.inputs.mode || 'fixture' }}
        run: |
          if [ "$MODE" = "live" ]; then
            FRAME_PATH='srt://0.0.0.0:9999?mode=listener&latency=2000000'
            echo "::notice ::Pipeline mode = LIVE (SRT listener on UDP 9999)"
          else
            FRAME_PATH='/mnt/data/sportscomm/files/fixtures/cricket_test_30s.mp4'
            echo "::notice ::Pipeline mode = FIXTURE replay"
          fi
          gcloud compute ssh qrackpot-prod-1 \
            --zone=asia-south1-a \
            --tunnel-through-iap \
            --command="sudo tee /etc/sportscomm/pipeline.env > /dev/null <<'PIPENV'
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CRICBUZZ_MATCH_ID=152097
          CRICBUZZ_MATCH_SLUG=rcb-vs-mi-54th-match-indian-premier-league-2026
          FRAME_SOURCE=file
          FRAME_SOURCE_FILE=$FRAME_PATH
          FRAME_SOURCE_FILE_OFFSET_S=0
          FRAME_SOURCE_FILE_LOOP=0
          USE_OPEN_SCOUT=1
          OPENSCOUT_DECOUPLED=1
          SCOUT_RAW_DUMP=1
          SHADOW_DELIVERY_DETECTOR=0
          PYTHONUNBUFFERED=1
          SKIP_PREMATCH_S=400
          PIPENV
          sudo chmod 0600 /etc/sportscomm/pipeline.env
          sudo chown root:root /etc/sportscomm/pipeline.env
          sudo systemctl enable pipeline.service
          sudo systemctl restart pipeline.service"

      - name: Health check qrackpot.com
        run: |
          sleep 15
          if curl -fsS -o /dev/null https://qrackpot.com/; then
            echo "::notice ::qrackpot.com is responding"
          else
            echo "::error ::qrackpot.com health check failed"
            exit 1
          fi

      - name: Pipeline service status
        run: |
          gcloud compute ssh qrackpot-prod-1 \
            --zone=asia-south1-a \
            --tunnel-through-iap \
            --command="
              echo '=== systemctl status ==='
              sudo systemctl status pipeline.service --no-pager -n 0 || true
              echo
              echo '=== waiting up to 90s for active state ==='
              for i in 1 2 3 4 5 6 7 8 9; do
                state=\$(sudo systemctl is-active pipeline.service)
                echo \"attempt \$i: state=\$state\"
                if [ \"\$state\" = active ]; then
                  echo 'pipeline.service ACTIVE'
                  break
                fi
                sleep 10
              done
              echo
              echo '=== final state ==='
              sudo systemctl is-active pipeline.service || true
              echo
              echo '=== journalctl last 60 lines ==='
              sudo journalctl -u pipeline.service -n 60 --no-pager
              echo
              echo '=== pipeline.log tail ==='
              sudo tail -30 /var/log/sportscomm/pipeline.log 2>/dev/null || echo '(no pipeline.log yet)'
              echo '=== pipeline-err.log tail ==='
              sudo tail -30 /var/log/sportscomm/pipeline-err.log 2>/dev/null || echo '(no pipeline-err.log yet)'
            "
          FINAL_STATE=$(gcloud compute ssh qrackpot-prod-1 --zone=asia-south1-a --tunnel-through-iap \
            --command="sudo systemctl is-active pipeline.service" 2>/dev/null || true)
          MODE="${{ github.event.inputs.mode || 'fixture' }}"
          if [ "$MODE" = "live" ] && [ "$FINAL_STATE" = "activating" ]; then
            echo "::notice ::pipeline.service is activating (waiting for SRT stream — expected for live mode)"
          elif [ "$FINAL_STATE" != "active" ]; then
            echo "::error ::pipeline.service did not reach active state (got: $FINAL_STATE)"
            exit 1
          else
            echo "::notice ::pipeline.service active"
          fi
