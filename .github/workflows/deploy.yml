name: Deploy to qrackpot-prod-1
on:
  push:
    branches: [derive-not-detect, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via IAP SSH
        run: |
          gcloud compute ssh qrackpot-prod-1 \
            --zone=asia-south1-a \
            --tunnel-through-iap \
            --command="cd /mnt/data/sportscomm && git pull && bash deploy/deploy.sh"

      - name: Verify
        run: |
          curl -fsS -o /dev/null https://qrackpot.com/ && echo "OK"
